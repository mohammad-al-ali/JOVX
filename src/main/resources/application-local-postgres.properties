# Only these three environment variables are required for local development.
# DB_PASSOWRD follows the spelling requested for this project.
jovx.database.url=${DB_URL}
jovx.database.username=${DB_USERNAME}
jovx.database.password=${DB_PASSOWRD}
jovx.database.connection-init-sql=SET TIME ZONE 'UTC'

# Paths only: private key material never enters Git.
# Hosted environments (Docker/Render) set JWT_PUBLIC_KEY_LOCATION and JWT_PRIVATE_KEY_LOCATION,
# e.g. file:/etc/secrets/public.pem. The defaults are the original development machine's files.
jovx.security.jwt.public-key=${JWT_PUBLIC_KEY_LOCATION:file:///C:/Users/HARTH/Documents/Codex/2026-11-13/new-chat/outputs/jovx/.local/identity-keys/public.pem}
jovx.security.jwt.private-key=${JWT_PRIVATE_KEY_LOCATION:file:///C:/Users/HARTH/Documents/Codex/2026-11-13/new-chat/outputs/jovx/.local/identity-keys/private.pem}

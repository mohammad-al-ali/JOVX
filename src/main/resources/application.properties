spring.application.name=JovxApi
# Local development is the default when launching the main class from IntelliJ.
spring.profiles.default=local-postgres
# Loopback by default; containers set SERVER_ADDRESS=0.0.0.0 and the host supplies PORT.
server.address=${SERVER_ADDRESS:127.0.0.1}
server.port=${PORT:18080}
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
jovx.security.jwt.issuer=${JWT_ISSUER:https://identity.jovx.local}
jovx.security.jwt.audience=jovx-api
spring.jackson.deserialization.fail-on-unknown-properties=true
jovx.security.sessions.access-lifetime=24h
jovx.security.sessions.refresh-lifetime=7d
jovx.security.sessions.max-pin-attempts=5
jovx.security.sessions.pin-lock-duration=15m
jovx.security.sessions.login-ip-limit=25
jovx.security.sessions.login-ip-window=15m
jovx.security.sessions.token-ip-limit=120
jovx.security.sessions.token-ip-window=1m
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
# In-app updates: CI publishes {base}/{app}/android/version.json and APKs under the prefix.
# Leave empty to disable importing; update checks still answer from published releases.
jovx.releases.manifest-base-url=${RELEASES_MANIFEST_BASE_URL:}
jovx.releases.download-url-prefix=${RELEASES_DOWNLOAD_URL_PREFIX:}
